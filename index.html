<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benden bir hatıra</title>
<meta name="description" content="Ahmet Enes'in ardında bıraktığı mektup.">
<meta name="theme-color" content="#0c0e13">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Italianno&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e13;
    --ink:#e9e3d6;
    --ink-soft:#a49c8c;
    --gold:#c9a961;
    --rule:rgba(201,169,97,.22);
    --bar-h:56px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'EB Garamond', Georgia, serif;
    font-size:19px;
    line-height:1.9;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    opacity:var(--moon,1);transition:opacity .4s linear;
    background:
      radial-gradient(900px 620px at 50% -8%, rgba(201,169,97,.10), transparent 60%),
      radial-gradient(700px 520px at 8% 100%, rgba(96,120,168,.07), transparent 65%),
      radial-gradient(700px 520px at 100% 85%, rgba(201,169,97,.05), transparent 65%);
  }

  body::after{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.85 0 0 0 0 0.7 0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:.9;
  }


  /* ————— ARKA PLAN: yağmurlu cam ————— */
  #bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    width:100%;height:100%;display:block;
  }
  .glassfog{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(70,90,125,.10), rgba(12,14,19,0) 35%, rgba(12,14,19,0) 65%, rgba(30,40,60,.18));
  }
  .dawn{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    opacity:var(--dawn,0);
    background:radial-gradient(1200px 520px at 50% 112%, rgba(130,160,210,.14), rgba(100,130,185,.05) 45%, transparent 72%);
    transition:opacity .4s linear;
  }
  .vignette{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 70% at 50% 50%, rgba(10,12,17,.38), transparent 75%),
      radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(4,5,8,.6) 100%);
  }


  /* ————— MÜZİK BUTONU ————— */
  .music-btn{
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(24,27,34,.7);
    border:1px solid rgba(201,169,97,.3);
    border-radius:50%;
    color:var(--gold);
    cursor:pointer;
    transition:border-color .3s, background .3s, transform .2s;
    padding:0;
  }
  .music-btn:hover{border-color:rgba(201,169,97,.65);background:rgba(24,27,34,.95)}
  .music-btn:active{transform:scale(.94)}
  .music-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .music-btn .waves{opacity:1;transition:opacity .3s}
  .music-btn .slash{opacity:0;transition:opacity .3s}
  .music-btn.off .waves{opacity:0}
  .music-btn.off .slash{opacity:1}
  .music-btn.off{color:var(--ink-soft)}

  /* ————— ÜST BAR — hep en üstte, tam genişlik ————— */
  .topbar{
    position:fixed;
    top:0;left:0;right:0;
    height:var(--bar-h);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:linear-gradient(to bottom, rgba(12,14,19,.92), rgba(12,14,19,.72));
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(201,169,97,.14);
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
  }

  .lang-switch{
    position:relative;
    font-family:'EB Garamond', Georgia, serif;
  }

  .lang-btn{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    background:rgba(24,27,34,.7);
    border:1px solid rgba(201,169,97,.3);
    border-radius:999px;
    color:#e9e3d6;
    font-family:inherit;
    font-size:.84rem;
    letter-spacing:.06em;
    cursor:pointer;
    transition:border-color .3s, background .3s, transform .2s;
    white-space:nowrap;
  }
  .lang-btn:hover{
    border-color:rgba(201,169,97,.65);
    background:rgba(24,27,34,.95);
  }
  .lang-btn:active{transform:scale(.97)}

  .lang-btn .flag{
    font-size:1.05rem;
    line-height:1;
    font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  }

  .lang-btn .caret{
    width:9px;height:9px;
    stroke:var(--gold);
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .3s;
    flex:0 0 auto;
  }
  .lang-switch.open .lang-btn .caret{transform:rotate(180deg)}

  .lang-menu{
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    min-width:210px;
    padding:6px;
    background:rgba(14,16,22,.97);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(201,169,97,.22);
    border-radius:14px;
    box-shadow:0 16px 48px rgba(0,0,0,.65);
    opacity:0;
    visibility:hidden;
    transform:translateY(-8px);
    transition:opacity .25s ease, transform .25s ease, visibility .25s;
    list-style:none;
  }
  .lang-switch.open .lang-menu{
    opacity:1;
    visibility:visible;
    transform:none;
  }

  .lang-menu button{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    text-align:left;
    padding:10px 13px;
    background:none;
    border:none;
    border-radius:9px;
    color:#d8d1c2;
    font-family:inherit;
    font-size:.96rem;
    letter-spacing:.015em;
    cursor:pointer;
    transition:background .2s, color .2s, padding-left .2s;
    white-space:nowrap;
  }
  .lang-menu button .flag{
    font-size:1.15rem;
    line-height:1;
    font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
    flex:0 0 auto;
  }
  .lang-menu button:hover{
    background:rgba(201,169,97,.13);
    color:#f4eee0;
    padding-left:17px;
  }
  .lang-menu button.active{
    color:var(--gold);
    background:rgba(201,169,97,.09);
  }
  .lang-menu button.active::after{
    content:'✓';
    margin-left:auto;
    font-size:.85em;
    opacity:.9;
  }

  /* ————— MEKTUP — bar'ın altından başlar ————— */
  .wrap{
    position:relative;z-index:1;
    max-width:660px;
    margin:0 auto;
    padding:calc(var(--bar-h) + 60px) 30px 130px;
    transition:opacity .28s ease;
  }

  .letter p{
    font-size:1.13rem;
    line-height:2;
    color:#ddd6c8;
    margin-bottom:1.65em;
    text-align:justify;
    text-justify:inter-word;
    hyphens:auto;
    -webkit-hyphens:auto;
  }

  .letter > p:first-of-type::first-letter{
    font-family:'EB Garamond', serif;
    font-weight:500;
    font-size:4.4em;
    line-height:.82;
    float:left;
    padding:.06em .14em 0 0;
    margin-top:.02em;
    color:var(--gold);
    text-shadow:0 0 40px rgba(201,169,97,.35);
  }

  .reveal{opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease}
  .reveal.in{opacity:1;transform:none}

  .pull{
    margin:3.8rem 0;
    padding:2.4rem 0;
    text-align:center;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .pull p{
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.18rem,3.2vw,1.42rem);
    line-height:1.75;
    color:#f0e9da;
    margin:0;
    text-align:center;
  }
  .pull p + p{margin-top:.3em}

  .sign{
    margin:3rem auto 0;
    padding-top:1.6rem;
    border-top:1px solid var(--rule);
    text-align:center;
    max-width:280px;
  }
  .sign .script{
    font-family:'Italianno', cursive;
    font-size:clamp(2.2rem,7vw,2.9rem);
    line-height:1.05;
    color:var(--gold);
    margin:.05em 0 .3em;
    text-shadow:0 0 34px rgba(201,169,97,.3);
  }
  .sign .date{
    font-size:1rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  @media (max-width:520px){
    :root{--bar-h:52px}
    body{font-size:18px}
    .wrap{padding:calc(var(--bar-h) + 40px) 22px 100px}
    .letter p{font-size:1.05rem;text-align:left}
    .letter > p:first-of-type::first-letter{font-size:3.6em}
    .sign{max-width:240px}
    .sign .date{font-size:.92rem;letter-spacing:.28em}
    .topbar{padding:0 12px}
    .lang-btn{padding:7px 11px;font-size:.78rem;gap:6px}
    .lang-btn .flag{font-size:.98rem}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<audio id="bgm" src="muzik.m4a" loop preload="auto"></audio>

<!-- ARKA PLAN: yağmurlu cam -->
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glassfog" aria-hidden="true"></div>
<div class="dawn" id="dawn"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- ÜST BAR -->
<header class="topbar">
  <button class="music-btn off" id="musicBtn" aria-label="Müziği aç / kapat" title="Müzik">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/>
      <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
      <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>
  <div class="lang-switch" id="langSwitch">
    <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Dil / Language">
      <span class="flag" id="langFlag">🇹🇷</span>
      <span id="langCurrent">Türkçe</span>
      <svg class="caret" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>

    <div class="lang-menu" id="langMenu" role="listbox" aria-label="Diller">
      <button role="option" data-lang="tr"><span class="flag">🇹🇷</span>Türkçe</button>
      <button role="option" data-lang="az"><span class="flag">🇦🇿</span>Azərbaycan dili</button>
      <button role="option" data-lang="de"><span class="flag">🇩🇪</span>Deutsch</button>
      <button role="option" data-lang="ru"><span class="flag">🇷🇺</span>Русский</button>
      <button role="option" data-lang="en"><span class="flag">🇬🇧</span>English</button>
    </div>
  </div>
</header>

<!-- MEKTUP -->
<main class="wrap letter" id="letter"></main>

<script>
(function(){
  'use strict';

  var content = {

    tr: {
      name: 'Türkçe', flag: '🇹🇷',
      paras: [
        `Bir gün sizden önce ölürsem, olmadı da haber alamazsanız, beni hemen yokluğa yazmayın. Sessizliği ölüm sanmayın. Bazen insan kaybolur da aslında bir yerlerde yaşamayı öğreniyordur; bazen de ölür de hâlâ sevdiği insanların içinde nefes alıyordur.`,
        `Kapı her çalındığında yüreğiniz ağzınıza gelirse, bilin ki o ses benden değil; ama ben o seslerin ardında, sizi duymaya devam ediyorum. Adımı anarsanız bir gün, gülümseyin. Ağlarsanız da ayıp değil; gözyaşı, sevginin adresidir.`,
        `Beni ararsanız eski mektuplarda, fotoğrafların arkasında, çayın buğusunda, yağmurun camdaki tıkırtısında arayın. Belki bir şarkıda çıkarım karşınıza; belki bir sokakta, eski bir kokuda, bir çocuğun gülüşünde. Orada olacağım. Tam eskisi gibi değil belki, ama sizden büsbütün ayrılmış da değil.`,
        `Ölürsem eğer, ardımdan uzun uzun ağıtlar yakmayın; beni anlatın. Hatalarımla, gülüşümle, korkularımla, sevdalarımla anlatın. İyi bir insan mıydım, bilemem; ama sizi sevmiştim, onu bilin. Sevgi, ölümün en çok kıskandığı şeydir.`,
        `Haber alamazsanız bir gün benden, ilk önce telaşlanın. Sonra oturun, bir çay demleyin. Belki sadece yorulmuşumdur, belki susmuşumdur, belki de gitmişimdir. Ama ne olursa olsun, sizi bulduğum her yerde ben de varım.`,
        `Bir gün sizden önce ölürsem, lütfen hayatı bırakmayın. Benim payıma da yaşayın. Gülün, gezin, sevin, yeni insanlar tanıyın. Sofraya bir tabak daha koyun; belki görünmem, ama gelirim. Belki rüzgâr olur saçınızı okşarım, belki uykuya dalarken omzunuza dokunurum. Belki hiçbir şey olmam, ama siz beni düşündüğünüz an, bir yerde var olurum.`,
        `Ve son bir şey: Beni unutmayın diye değil, beni hatırlayınca acı çekmeyin diye söylüyorum. Ben sizin hayatınıza bir misafir gibi gelmedim; bir parça oldum. O parça sizde kaldığı sürece, ben ölmüş sayılmam.`,
        `Hoşça kalın demiyorum. Çünkü hoşça kalmak, bir gün yeniden karşılaşma ihtimalini saklar içinde. Belki karşılaşırız. Belki bir bahar sabahı, belki bir yağmur sonrası, belki hiç beklemediğiniz bir anda.`
      ],
      pull: [
        `O zamana kadar:`,
        `Kendinize iyi bakın.`,
        `Birbirinize iyi bakın.`,
        `Beni sevdiğiniz gibi, hayatı da sevin.`
      ],
      closing: `Selametle Kalın...`
    },

    az: {
      name: 'Azərbaycan dili', flag: '🇦🇿',
      paras: [
        `Bir gün sizdən əvvəl ölsəm, ya da xəbər ala bilməsəniz, məni dərhal yoxluğa yazmayın. Sükutu ölüm sanmayın. Bəzən insan yox olur, əslində isə haradasa yaşamağı öyrənir; bəzən də ölür, amma hələ də sevdiyi insanların içində nəfəs alır.`,
        `Qapı hər döyüldükdə ürəyiniz ağzınıza gəlirsə, bilin ki o səs məndən deyil; amma mən o səslərin arxasında sizi dinləməyə davam edirəm. Bir gün adımı çəksəniz, gülümsəyin. Ağlasanız da ayıb deyil; göz yaşı sevginin ünvanıdır.`,
        `Məni axtarsanız köhnə məktublarda, fotoşəkillərin arxasında, çayın buxarında, yağışın şüşədəki tıqqıltısında axtarın. Bəlkə bir mahnıda qarşınıza çıxaram; bəlkə bir küçədə, köhnə bir qoxuda, bir uşağın gülüşündə. Orada olacağam. Bəlkə tam əvvəlki kimi deyil, amma sizdən tamamilə ayrılmış da deyil.`,
        `Ölsəm əgər, ardımca uzun-uzadı yas tutmayın; məndən danışın. Səhvlərimlə, gülüşümlə, qorxularımla, sevgilərimlə məndən danışın. Yaxşı insan idimmi, bilmirəm; amma sizi sevmişdim, onu bilin. Sevgi, ölümün ən çox qısqandığı şeydir.`,
        `Bir gün məndən xəbər ala bilməsəniz, əvvəlcə təlaşlanın. Sonra oturun, bir çay dəmləyin. Bəlkə sadəcə yorulmuşam, bəlkə susmuşam, bəlkə də getmişəm. Amma nə olursa olsun, sizi tapdığım hər yerdə mən də varam.`,
        `Bir gün sizdən əvvəl ölsəm, xahiş edirəm həyatı buraxmayın. Mənim payıma da yaşayın. Gülün, gəzin, sevin, yeni insanlar tanıyın. Süfrəyə bir boşqab da qoyun; bəlkə görünmərəm, amma gələrəm. Bəlkə külək olub saçınızı oxşayaram, bəlkə yuxuya dalarkən çiyninizə toxunaram. Bəlkə heç nə olmam, amma siz məni düşündüyünüz an, bir yerdə var oluram.`,
        `Və son bir şey: Məni unutmayın deyə deyil, məni xatırlayanda əziyyət çəkməyin deyə söyləyirəm. Mən sizin həyatınıza bir qonaq kimi gəlmədim; bir parça oldum. O parça sizdə qaldığı müddətcə, mən ölmüş sayılmıram.`,
        `Xoşça qalın demirəm. Çünki xoşça qalmaq, bir gün yenidən qarşılaşma ehtimalını içində saxlayır. Bəlkə qarşılaşarıq. Bəlkə bir bahar səhəri, bəlkə bir yağışdan sonra, bəlkə heç gözləmədiyiniz bir anda.`
      ],
      pull: [
        `O vaxta qədər:`,
        `Özünüzə yaxşı baxın.`,
        `Bir-birinizə yaxşı baxın.`,
        `Məni sevdiyiniz kimi, həyatı da sevin.`
      ],
      closing: `Salamat qalın...`
    },

    de: {
      name: 'Deutsch', flag: '🇩🇪',
      paras: [
        `Wenn ich eines Tages vor euch sterbe, oder wenn ihr nichts von mir hört, erklärt mich nicht gleich für verschwunden. Haltet das Schweigen nicht für den Tod. Manchmal verschwindet ein Mensch, doch eigentlich lernt er irgendwo zu leben; und manchmal stirbt einer, und atmet doch weiter in den Menschen, die er liebte.`,
        `Wenn euch bei jedem Klopfen an der Tür das Herz in die Kehle springt, so wisst, dass dieser Klang nicht von mir ist; aber hinter diesen Klängen höre ich euch weiterhin. Wenn ihr eines Tages meinen Namen nennt, lächelt. Und wenn ihr weint, ist das keine Schande; Tränen sind die Adresse der Liebe.`,
        `Wenn ihr mich sucht, sucht in alten Briefen, hinter Fotografien, im Dampf des Tees, im Klopfen des Regens an der Scheibe. Vielleicht begegne ich euch in einem Lied; vielleicht auf einer Straße, in einem alten Duft, im Lachen eines Kindes. Ich werde dort sein. Vielleicht nicht ganz wie früher, aber auch nicht völlig von euch geschieden.`,
        `Wenn ich sterbe, haltet keine langen Klagen nach mir; erzählt von mir. Erzählt von mir mit meinen Fehlern, meinem Lachen, meinen Ängsten, meinen Leidenschaften. Ob ich ein guter Mensch war, weiß ich nicht; aber ich habe euch geliebt, das sollt ihr wissen. Die Liebe ist das, was der Tod am meisten beneidet.`,
        `Wenn ihr eines Tages nichts von mir hört, erschreckt zuerst. Dann setzt euch hin, brüht einen Tee auf. Vielleicht bin ich nur müde, vielleicht verstummt, vielleicht auch gegangen. Doch was auch geschieht, überall wo ich euch fand, bin auch ich.`,
        `Wenn ich eines Tages vor euch sterbe, bitte lasst das Leben nicht los. Lebt auch für meinen Anteil. Lacht, reist, liebt, lernt neue Menschen kennen. Stellt einen Teller mehr auf den Tisch; vielleicht bin ich nicht zu sehen, aber ich komme. Vielleicht werde ich der Wind sein, der euer Haar streichelt, vielleicht berühre ich eure Schulter, wenn ihr einschlaft. Vielleicht bin ich gar nichts, doch in dem Moment, in dem ihr an mich denkt, bin ich irgendwo.`,
        `Und eines noch: Ich sage das nicht, damit ihr mich nicht vergesst, sondern damit ihr nicht leidet, wenn ihr euch an mich erinnert. Ich bin nicht wie ein Gast in euer Leben gekommen; ich bin ein Teil davon geworden. Solange dieser Teil in euch bleibt, gelte ich nicht als gestorben.`,
        `Ich sage nicht Lebewohl. Denn Lebewohl birgt in sich die Möglichkeit, eines Tages wieder zusammenzutreffen. Vielleicht treffen wir uns. Vielleicht an einem Frühlingsmorgen, vielleicht nach einem Regen, vielleicht in einem Augenblick, den ihr am wenigsten erwartet.`
      ],
      pull: [
        `Bis dahin:`,
        `Passt auf euch auf.`,
        `Passt aufeinander auf.`,
        `Liebt das Leben, so wie ihr mich geliebt habt.`
      ],
      closing: `Bleibt in Frieden...`
    },

    ru: {
      name: 'Русский', flag: '🇷🇺',
      paras: [
        `Если однажды я умру раньше вас, или если вы не получите от меня вестей, не записывайте меня сразу в небытие. Не принимайте молчание за смерть. Иногда человек исчезает, а на самом деле где-то учится жить; а иногда умирает — и всё же дышит внутри тех, кого любил.`,
        `Если при каждом стуке в дверь у вас сердце подступает к горлу, знайте: этот звук не от меня; но за этими звуками я продолжаю вас слышать. Если однажды вы назовёте моё имя, улыбнитесь. А если заплачете — не стыдно; слёзы — это адрес любви.`,
        `Если будете искать меня, ищите в старых письмах, за фотографиями, в паре от чая, в стуке дождя по стеклу. Может, я встречусь вам в песне; может, на улице, в старом запахе, в смехе ребёнка. Я буду там. Может, не совсем прежний, но и не совсем от вас отделённый.`,
        `Если я умру, не поднимайте долгих плачей обо мне; рассказывайте обо мне. Рассказывайте обо мне с моими ошибками, моим смехом, моими страхами, моими страстями. Хорошим ли я был человеком — не знаю; но я вас любил, это знайте. Любовь — то, чему смерть завидует больше всего.`,
        `Если однажды вы не получите от меня вестей, сначала встревожьтесь. Потом сядьте, заварите чай. Может, я просто устал, может, замолчал, может, ушёл. Но что бы ни случилось, везде, где я находил вас, есть и я.`,
        `Если однажды я умру раньше вас, пожалуйста, не оставляйте жизнь. Живите и за мою долю. Смейтесь, путешествуйте, любите, знакомьтесь с новыми людьми. Поставьте на стол ещё одну тарелку; может, меня не видно, но я приду. Может, я стану ветром, что погладит ваши волосы, может, коснусь вашего плеча, когда вы засыпаете. Может, меня не будет вовсе, но в тот миг, когда вы вспомните обо мне, я где-то существую.`,
        `И ещё одно: я говорю это не для того, чтобы вы меня не забыли, а чтобы вы не страдали, когда вспоминаете. Я вошёл в вашу жизнь не как гость; я стал её частью. Пока эта часть остаётся в вас, я не считаюсь умершим.`,
        `Я не говорю «прощайте». Потому что прощание хранит в себе возможность однажды снова встретиться. Может, мы встретимся. Может, весенним утром, может, после дождя, может, в миг, которого вы совсем не ждёте.`
      ],
      pull: [
        `До тех пор:`,
        `Берегите себя.`,
        `Берегите друг друга.`,
        `Любите жизнь так, как любили меня.`
      ],
      closing: `Оставайтесь в мире...`
    },

    en: {
      name: 'English', flag: '🇬🇧',
      paras: [
        `If I die before you one day, or if you can't hear from me, don't write me off as gone right away. Don't mistake silence for death. Sometimes a person disappears, but is actually somewhere learning how to live; and sometimes a person dies, yet still breathes within the people they loved.`,
        `If your heart leaps to your throat every time the door is knocked, know that sound isn't me; but behind those sounds, I'm still listening to you. If you speak my name one day, smile. And if you cry, that's no shame; tears are the address of love.`,
        `If you look for me, look in old letters, behind photographs, in the steam of tea, in the tapping of rain on the window. Maybe I'll appear in a song; maybe on a street, in an old scent, in a child's laughter. I'll be there. Maybe not exactly as before, but not entirely parted from you either.`,
        `If I die, don't hold long laments after me; tell of me. Tell of me with my mistakes, my laughter, my fears, my loves. Whether I was a good person, I don't know; but I loved you, know that. Love is what death envies most.`,
        `If you don't hear from me one day, first be alarmed. Then sit down, brew a tea. Maybe I'm only tired, maybe I've fallen silent, maybe I've gone. But whatever happens, wherever I found you, I am there too.`,
        `If I die before you one day, please don't abandon life. Live for my share too. Laugh, travel, love, meet new people. Set one more plate at the table; maybe I won't be seen, but I'll come. Maybe I'll be the wind that strokes your hair, maybe I'll touch your shoulder as you fall asleep. Maybe I'll be nothing at all, but the moment you think of me, I exist somewhere.`,
        `And one last thing: I'm not saying this so you don't forget me, but so you don't suffer when you remember me. I didn't come into your life like a guest; I became a part of it. As long as that part remains in you, I'm not considered dead.`,
        `I'm not saying goodbye. Because farewell hides within it the possibility of meeting again one day. Maybe we'll meet. Maybe on a spring morning, maybe after a rain, maybe at a moment you least expect.`
      ],
      pull: [
        `Until then:`,
        `Take care of yourselves.`,
        `Take care of each other.`,
        `Love life as you loved me.`
      ],
      closing: `Stay in peace...`
    }
  };

  var SUPPORTED = ['tr','az','de','ru','en'];
  var STORAGE_KEY = 'ahmet-enes-lang';

  var letter    = document.getElementById('letter');
  var btn       = document.getElementById('langBtn');
  var menu      = document.getElementById('langMenu');
  var switchBox = document.getElementById('langSwitch');
  var curLabel  = document.getElementById('langCurrent');
  var curFlag   = document.getElementById('langFlag');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isFirst = true;
  var io = null;

  function buildHTML(data, revealed){
    var cls = revealed ? 'reveal in' : 'reveal';
    var html = '';

    data.paras.forEach(function(p){
      html += '<p class="' + cls + '">' + p + '</p>';
    });

    html += '<div class="pull ' + cls + '">';
    data.pull.forEach(function(line){
      html += '<p>' + line + '</p>';
    });
    html += '</div>';

    html += '<p class="' + cls + '">' + data.closing + '</p>';

    html += '<div class="sign ' + cls + '">' +
              '<p class="script">Ahmet Enes</p>' +
              '<p class="date">13.10.2026 — ∞</p>' +
            '</div>';

    return html;
  }

  function observeReveals(){
    var items = letter.querySelectorAll('.reveal');
    if (reduce || !('IntersectionObserver' in window)){
      items.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    if (io) io.disconnect();
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting){
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    items.forEach(function(el){ io.observe(el); });
  }

  function render(lang, instant){
    var data = content[lang];
    if (!data) return;
    document.documentElement.lang = lang;
    if (instant){
      letter.innerHTML = buildHTML(data, true);
    } else {
      letter.innerHTML = buildHTML(data, false);
      observeReveals();
    }
    menu.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === lang);
      b.setAttribute('aria-selected', b.dataset.lang === lang ? 'true' : 'false');
    });
    curLabel.textContent = data.name;
    curFlag.textContent  = data.flag;
  }

  function switchLang(lang){
    if (!content[lang]) return;
    try { localStorage.setItem(STORAGE_KEY, lang); } catch(e){}
    if (isFirst){ render(lang, false); isFirst = false; return; }
    if (reduce){ render(lang, true); return; }
    letter.style.opacity = '0';
    setTimeout(function(){
      render(lang, true);
      letter.style.opacity = '1';
    }, 280);
  }

  function openMenu(){
    switchBox.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
  }
  function closeMenu(){
    switchBox.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    switchBox.classList.contains('open') ? closeMenu() : openMenu();
  });
  menu.addEventListener('click', function(e){
    var b = e.target.closest('button[data-lang]');
    if (!b) return;
    switchLang(b.dataset.lang);
    closeMenu();
  });
  document.addEventListener('click', function(e){
    if (!switchBox.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeMenu();
  });

  var saved;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch(e){}
  var browser = (navigator.language || 'tr').slice(0,2).toLowerCase();
  var initial = (saved && SUPPORTED.indexOf(saved) !== -1)
    ? saved
    : (SUPPORTED.indexOf(browser) !== -1 ? browser : 'tr');
  switchLang(initial);

})();
</script>

<script>
/* Arka plan: yağmurlu cam.
   Uzakta bulanık ışıklar, camda kırılma etkili damlalar, birleşip kayan damlalar.
   Mektubun sonuna doğru yağmur diner. */
(function(){
  var cv = document.getElementById('bg');
  var ctx = cv.getContext('2d');
  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,dpr=1, progress=0, rafId=null, t0=performance.now(), frameN=0;
  function rnd(a,b){return a+Math.random()*(b-a)}

  /* bulanık ışık ve sis için yumuşak daire */
  function glow(r,g,b){
    var c=document.createElement('canvas'); c.width=c.height=128;
    var x=c.getContext('2d');
    var gr=x.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,'rgba('+r+','+g+','+b+',.85)');
    gr.addColorStop(.6,'rgba('+r+','+g+','+b+',.55)');
    gr.addColorStop(.9,'rgba('+r+','+g+','+b+',.25)');
    gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
    x.fillStyle=gr; x.fillRect(0,0,128,128);
    return c;
  }
  var sprites = [glow(110,140,200), glow(90,120,175), glow(215,175,105), glow(150,165,205)];
  var fogS = glow(120,145,185);

  /* gerçekçi damla: koyu kenar, alt tarafta ışık toplayan hilal, üstte parlama */
  var dropS = (function(){
    var S=96, c=document.createElement('canvas'); c.width=c.height=S;
    var x=c.getContext('2d'), cx=S/2, cy=S/2, R=S/2-3;
    var g=x.createRadialGradient(cx,cy-R*.1,R*.1,cx,cy,R);
    g.addColorStop(0,'rgba(150,175,215,.05)');
    g.addColorStop(.7,'rgba(150,175,215,.12)');
    g.addColorStop(1,'rgba(6,8,14,.60)');
    x.beginPath(); x.arc(cx,cy,R,0,6.2832); x.fillStyle=g; x.fill();
    x.save(); x.beginPath(); x.arc(cx,cy,R,0,6.2832); x.clip();
    var g2=x.createRadialGradient(cx,cy+R*.6,0,cx,cy+R*.6,R*.75);
    g2.addColorStop(0,'rgba(215,230,255,.55)');
    g2.addColorStop(1,'rgba(215,230,255,0)');
    x.fillStyle=g2; x.fillRect(0,0,S,S);
    x.restore();
    x.beginPath(); x.arc(cx,cy,R*.97,0,6.2832);
    x.lineWidth=1.6; x.strokeStyle='rgba(210,225,250,.30)'; x.stroke();
    x.save(); x.translate(cx-R*.36,cy-R*.42); x.rotate(-.6);
    x.beginPath(); x.ellipse(0,0,R*.22,R*.12,0,0,6.2832);
    x.fillStyle='rgba(255,255,255,.9)'; x.fill();
    x.restore();
    return c;
  })();

  var bokeh=[], fog=[], drops=[], runners=[], far=[], near=[], cap=100, maxRun=5;

  function build(){
    var small = W < 520;
    cap = small ? 95 : 170;
    maxRun = 0;
    bokeh=[]; fog=[]; drops=[]; runners=[]; far=[]; near=[];

    var nb = small ? 9 : 14;
    for(var i=0;i<nb;i++){
      bokeh.push({
        x:rnd(0,W), y:rnd(H*.05,H*.95),
        r:rnd(small?34:46, small?85:120),
        a:rnd(.05,.12), ph:rnd(0,6.28), sp:rnd(.15,.5),
        c: Math.random()<.22 ? 2 : (Math.random()<.5 ? 0 : (Math.random()<.5?1:3))
      });
    }
    for(var f=0;f<5;f++){
      fog.push({x:rnd(0,W), y:rnd(0,H), r:rnd(220,380), a:rnd(.025,.05), vx:rnd(-.05,.05), ph:rnd(0,6.28)});
    }
    for(var k=0;k<cap*.7;k++) addDrop(true);
    for(var j=0;j<maxRun-1;j++) makeRunner({x:rnd(0,W), y:rnd(0,H*.8), r:rnd(3.4,5)});

    var nf = small ? 18 : 30, nn = small ? 10 : 16;
    for(var q=0;q<nf;q++) far.push({x:rnd(0,W), y:rnd(0,H), l:rnd(14,30), v:rnd(5,8), a:rnd(.03,.055)});
    for(var w=0;w<nn;w++) near.push({x:rnd(0,W), y:rnd(0,H), l:rnd(50,110), v:rnd(14,22), a:rnd(.05,.10)});
  }

  function addDrop(initial){
    var tiny = Math.random()<.45;
    drops.push({
      x:rnd(0,W), y:rnd(0,H),
      r: initial ? (tiny ? rnd(.6,1.3) : rnd(1.2,3.8)) : rnd(.6,1.3),
      grow: rnd(.0006,.0035)
    });
  }
  function cluster(){
    /* cama bir anda vuran küçük damla öbeği */
    var cx=rnd(0,W), cy=rnd(0,H*.9), n=Math.floor(rnd(3,7));
    for(var i=0;i<n && drops.length<cap+20;i++){
      drops.push({x:cx+rnd(-26,26), y:cy+rnd(-26,26), r:rnd(.7,1.9), grow:rnd(.0008,.0025)});
    }
  }
  function makeRunner(d){
    runners.push({
      x:d.x, y:d.y, r:Math.max(3.2,d.r),
      v:0, vt:rnd(.5,1.2), moving:true, wob:0, trail:[]
    });
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    build();
    if(reduce) draw(performance.now());
  }

  function drawDrop(x,y,r,asp,a){
    var w=r*2*.9, h=r*2*asp;
    ctx.globalAlpha=a;
    ctx.drawImage(dropS, x-w/2, y-h/2, w, h);
  }

  function update(rain){
    frameN++;
    if(drops.length < cap && Math.random() < .12*rain) addDrop(false);
    if(Math.random() < .004*rain) cluster();

    /* duran damlalar büyür, ağırlaşınca kaymaya başlar */
    for(var i=drops.length-1;i>=0;i--){
      var d=drops[i];
      d.r += d.grow*rain;
      if(d.r>4.9){ drops.splice(i,1); }
    }

    /* kayan damlalar */
    for(var k=runners.length-1;k>=0;k--){
      var r=runners[k];
      if(r.moving){ if(Math.random()<.016) r.moving=false; }
      else         { if(Math.random()<.03+r.r*.004) { r.moving=true; r.vt=rnd(.5,1.4)+r.r*.08; } }
      var target = r.moving ? r.vt : 0;
      r.v += (target - r.v)*.06;
      var sp = r.v*(.6+rain*.5);

      if(sp>.02){
        r.wob += (Math.random()-.5)*.03; r.wob*=.98;
        if(r.wob>.2) r.wob=.2; if(r.wob<-.2) r.wob=-.2;
        r.y += sp; r.x += r.wob;
        r.r -= .0016*sp;
        r.trail.push({x:r.x, y:r.y, a:1, w:r.r});
        if(r.trail.length>220) r.trail.shift();
        if(Math.random()<.05 && drops.length<cap+30){
          drops.push({x:r.x+rnd(-.8,.8), y:r.y-r.r*rnd(1.1,2), r:rnd(.5,1.1), grow:.0004});
        }
      }

      /* yoluna çıkan damlaları içine katar */
      for(var m=drops.length-1;m>=0;m--){
        var dd=drops[m], dx=dd.x-r.x, dy=dd.y-r.y;
        if(Math.abs(dx)<r.r*.85+dd.r && dy>-r.r*1.1 && dy<r.r+dd.r){
          r.r = Math.sqrt(r.r*r.r + dd.r*dd.r*.5);
          r.v = Math.min(r.v*1.12+.1, 2.4);
          drops.splice(m,1);
        }
      }

      for(var t=r.trail.length-1;t>=0;t--){
        r.trail[t].a -= .003;
        if(r.trail[t].a<=0){ r.trail.splice(0,t+1); break; }
      }
      if(r.y>H+30){ runners.splice(k,1); }
      else if(r.r<1.5){ drops.push({x:r.x,y:r.y,r:1.3,grow:.0004}); runners.splice(k,1); }
    }
    while(runners.length < maxRun && Math.random()<.02*rain+.002){
      makeRunner({x:rnd(0,W), y:rnd(-10,H*.3), r:rnd(3.4,5)});
    }

    /* dışarıda düşen yağmur */
    for(var s=0;s<far.length;s++){
      var f=far[s]; f.y+=f.v*rain; f.x-=f.v*rain*.14;
      if(f.y>H+40||f.x<-40){ f.y=rnd(-60,-10); f.x=rnd(0,W+40); }
    }
    for(var u=0;u<near.length;u++){
      var n=near[u]; n.y+=n.v*rain; n.x-=n.v*rain*.16;
      if(n.y>H+130||n.x<-130){ n.y=rnd(-180,-20); n.x=rnd(0,W+80); }
    }
  }

  function draw(now){
    var t=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);
    var rain = Math.max(.12, 1 - progress*.9);
    var warm = progress;
    var par = (window.scrollY||0)*.04;

    /* cam buğusu */
    for(var g=0;g<fog.length;g++){
      var fo=fog[g];
      fo.x += fo.vx; if(fo.x<-fo.r) fo.x=W+fo.r; if(fo.x>W+fo.r) fo.x=-fo.r;
      ctx.globalAlpha = fo.a*(.75+.25*Math.sin(t*.2+fo.ph))*(.4+rain*.6);
      ctx.drawImage(fogS, fo.x-fo.r, fo.y-fo.r, fo.r*2, fo.r*2);
    }

    /* bulanık uzak ışıklar */
    for(var i=0;i<bokeh.length;i++){
      var b=bokeh[i];
      var pul = .7+.3*Math.sin(t*b.sp+b.ph);
      ctx.globalAlpha = b.a*pul*(b.c===2 ? Math.max(0,1-warm*1.6) : .9);
      ctx.drawImage(sprites[b.c], b.x-b.r, b.y-par*(.4+b.r/120)-b.r, b.r*2, b.r*2);
    }
    ctx.globalAlpha=1;

    /* uzak ve yakın yağmur */
    ctx.lineCap='round';
    ctx.lineWidth=.7;
    for(var s=0;s<far.length;s++){
      var f=far[s];
      ctx.strokeStyle='rgba(185,205,235,'+(f.a*rain)+')';
      ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x+f.l*.14,f.y-f.l); ctx.stroke();
    }
    ctx.lineWidth=1.1;
    for(var u=0;u<near.length;u++){
      var n=near[u];
      ctx.strokeStyle='rgba(195,212,238,'+(n.a*rain)+')';
      ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(n.x+n.l*.16,n.y-n.l); ctx.stroke();
    }

    /* damla izleri: ıslak iz + ince parlak çizgi */
    for(var k=0;k<runners.length;k++){
      var tr=runners[k].trail;
      for(var j=2;j<tr.length;j+=2){
        var a=Math.min(tr[j].a,tr[j-2].a);
        var w=Math.max(.8,tr[j].w*.55);
        ctx.strokeStyle='rgba(170,195,230,'+(.07*a)+')';
        ctx.lineWidth=w*1.8;
        ctx.beginPath(); ctx.moveTo(tr[j-2].x,tr[j-2].y); ctx.lineTo(tr[j].x,tr[j].y); ctx.stroke();
        ctx.strokeStyle='rgba(215,230,250,'+(.11*a)+')';
        ctx.lineWidth=Math.max(.6,w*.5);
        ctx.beginPath(); ctx.moveTo(tr[j-2].x,tr[j-2].y); ctx.lineTo(tr[j].x,tr[j].y); ctx.stroke();
      }
    }

    /* camdaki damlalar */
    for(var m=0;m<drops.length;m++){
      var d=drops[m];
      var fade = d.r>3.7 ? Math.max(0,1-(d.r-3.7)/1.2) : 1;
      drawDrop(d.x,d.y,d.r, 1.06, fade);
    }
    for(var q=0;q<runners.length;q++){
      var r=runners[q];
      drawDrop(r.x,r.y,r.r, 1.2+Math.min(.35,r.v*.22), 1);
    }
    ctx.globalAlpha=1;
    return rain;
  }

  function loop(now){
    var rain = draw(now);
    update(rain);
    rafId=requestAnimationFrame(loop);
  }
  function start(){ if(!reduce && !rafId) rafId=requestAnimationFrame(loop); }
  function stop(){ if(rafId){ cancelAnimationFrame(rafId); rafId=null; } }

  function onScroll(){
    var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    progress = Math.min(1, Math.max(0, window.scrollY / max));
    root.style.setProperty('--dawn', Math.pow(progress,1.7).toFixed(3));
    root.style.setProperty('--moon', Math.max(0, 1 - progress*1.25).toFixed(3));
    if(reduce) draw(performance.now());
  }

  window.addEventListener('resize', resize);
  window.addEventListener('scroll', onScroll, {passive:true});
  document.addEventListener('visibilitychange', function(){ document.hidden ? stop() : start(); });

  resize(); onScroll(); start();
})();
</script>

<script>
/* Arka plan müziği: sürekli döngüde çalar.
   Tarayıcılar sesi kullanıcı ekrana dokunmadan başlatmaya izin vermez,
   o yüzden ilk dokunuşta/tıklamada otomatik başlar. */
(function(){
  var a = document.getElementById('bgm');
  var b = document.getElementById('musicBtn');
  var TARGET = 0.6;
  var userStopped = false;
  var fadeId = null;

  function ui(){ b.classList.toggle('off', a.paused); }

  function fadeTo(v, ms, done){
    if (fadeId) clearInterval(fadeId);
    var from = a.volume, steps = Math.max(1, Math.round(ms/50)), i = 0;
    fadeId = setInterval(function(){
      i++;
      a.volume = Math.min(1, Math.max(0, from + (v-from)*(i/steps)));
      if (i >= steps){ clearInterval(fadeId); fadeId = null; if(done) done(); }
    }, 50);
  }

  function play(){
    a.volume = 0;
    var p = a.play();
    if (p && p.then){
      p.then(function(){ fadeTo(TARGET, 2500); ui(); removeUnlock(); })
       .catch(function(){ ui(); });
    } else { fadeTo(TARGET, 2500); ui(); }
  }

  function unlock(e){
    if (userStopped) return;
    if (b.contains(e.target)) return;
    if (a.paused) play();
  }
  function removeUnlock(){
    ['pointerdown','touchend','click','keydown'].forEach(function(ev){
      document.removeEventListener(ev, unlock, true);
    });
  }
  ['pointerdown','touchend','click','keydown'].forEach(function(ev){
    document.addEventListener(ev, unlock, true);
  });

  b.addEventListener('click', function(e){
    e.stopPropagation();
    if (a.paused){ userStopped = false; play(); }
    else { userStopped = true; fadeTo(0, 500, function(){ a.pause(); ui(); }); }
  });

  a.addEventListener('play', ui);
  a.addEventListener('pause', ui);

  /* sayfa açılır açılmaz dene; izin verilmezse ilk dokunuşu bekler */
  a.volume = 0;
  var first = a.play();
  if (first && first.then){
    first.then(function(){ fadeTo(TARGET, 2500); ui(); removeUnlock(); }).catch(function(){ ui(); });
  }
  ui();
})();
</script>
</body>
</html>
